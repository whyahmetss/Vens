# Gece vardiyası sınırları (şartname Bölüm 18.4).
# Bu dosya ajanın yazma alanı dışındadır — kendi bütçesini büyütemez (18.5).

# İncelenemeyen değişiklik onaylanmış sayılmaz. Bu satır sayısını aşan
# öneri otomatik reddedilir.
DIFF_UST_SINIR=400

# Onaylamama günü (18.6). ISO gün numarası: 1=Pazartesi ... 7=Pazar.
# O gün hiçbir şey merge edilmez; sadece birikmiş değişiklikler okunur.
# Kapatmak için 0 yaz.
ONAYLAMAMA_GUNU=7

# Gece dallarının öneki.
DAL_ONEKI=night

# Geri dönüş noktalarının etiket öneki. Her gün ayrı nokta (18.4).
IYI_ONEKI=iyi

# Gece ajanı komutu. Boşsa gece koşusu görev seçer, dalı hazırlar ve
# rapor iskeletini yazar ama KOD YAZMAZ — ajanı sen tanımlarsın.
# Örnek: VENUS_AJAN="claude -p"
VENUS_AJAN=""
