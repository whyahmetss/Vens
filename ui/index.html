<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VENÜS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#040604;
    --panel:#0B0F0C;
    --ink:#E8F0E8;
    --gray:#6E7A6E;
    --neon:#00FF41;
    --warn:#FFB03A;
    --rule:rgba(255,255,255,.10);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--void);color:var(--ink);
    font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:13px;
    overflow:hidden;-webkit-font-smoothing:antialiased;
  }
  .veil{position:fixed;inset:0;pointer-events:none;z-index:60}
  .veil::before{content:'';position:absolute;inset:0;
    background:repeating-linear-gradient(to bottom,transparent 0 3px,rgba(0,0,0,.22) 3px 4px)}
  .veil::after{content:'';position:absolute;inset:0;
    background:radial-gradient(ellipse at 50% 40%,transparent 50%,rgba(0,0,0,.75) 100%)}

  .shell{height:100%;display:grid;grid-template-rows:auto 1fr auto;
         gap:12px;padding:16px;max-width:1180px;margin:0 auto}

  /* --- üst ray: minimal (Bölüm 13) --- */
  .rail{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;
        border-bottom:1px solid var(--rule);padding-bottom:12px}
  .rail .meta{justify-self:end}
  .mark{display:flex;align-items:baseline;gap:10px}
  .mark h1{font-family:'VT323',monospace;font-size:34px;letter-spacing:.14em;
           font-weight:400;color:var(--ink);line-height:1}
  .state{font-size:9px;letter-spacing:.22em;color:var(--neon);text-transform:uppercase}
  .pip{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--neon);
       box-shadow:0 0 8px var(--neon);margin-right:6px;animation:beat 2.6s infinite}
  .pip.off{background:var(--warn);box-shadow:0 0 8px var(--warn)}
  @keyframes beat{0%,100%{opacity:1}50%{opacity:.3}}
  .meta{display:flex;gap:22px;justify-content:flex-end;text-align:right}
  .cell .k{font-size:9px;letter-spacing:.2em;color:var(--gray);text-transform:uppercase}
  .cell .v{font-size:13px;font-weight:500}
  .stamp{font-family:'VT323',monospace;font-size:30px;line-height:1;letter-spacing:.03em}

  /* --- akış --- */
  .flow{overflow-y:auto;scrollbar-width:thin;scrollbar-color:#253025 transparent;padding-right:4px}
  .flow::-webkit-scrollbar{width:5px}
  .flow::-webkit-scrollbar-thumb{background:#253025}
  .row{white-space:pre-wrap;word-break:break-word;line-height:1.6}
  .row.dim{color:var(--gray)}
  .row.warn{color:var(--warn)}
  .row.hi{color:var(--neon)}
  .row.echo{color:var(--gray)}
  /* Bölüm 12: kesintili bildirim komut çıktısı değildir, öyle de görünmemeli. */
  .row.bildirim{border-left:2px solid var(--neon);padding-left:9px;color:var(--neon)}
  .row.bildirim.kritik{border-color:var(--warn);color:var(--warn)}
  #rozet{color:var(--warn)}
  #rozet:empty{display:none}
  .row.wake{font-family:'VT323',monospace;font-size:30px;color:var(--ink);
            margin:18px 0 6px;letter-spacing:.04em}
  .row.wake b{color:var(--neon);font-weight:400;text-shadow:0 0 18px rgba(0,255,65,.45)}

  .ask{display:flex;gap:10px;align-items:baseline;margin-top:10px;
       border-top:1px solid var(--rule);padding-top:12px}
  /* display:flex, hidden özniteliğinin display:none'unu eziyordu — girdi
     açılış sekansı boyunca yazılabilir kalıyor ve çıktı animasyona karışıyordu. */
  .ask[hidden]{display:none}
  .ask .sig{color:var(--neon);flex-shrink:0}
  .mik{flex-shrink:0;width:26px;height:26px;border:1px solid var(--rule);border-radius:50%;
       background:none;color:var(--gray);cursor:pointer;font:inherit;font-size:12px;
       display:grid;place-items:center;transition:color .15s,border-color .15s}
  .mik:hover{color:var(--ink);border-color:var(--neon)}
  .mik[hidden]{display:none}
  .mik.dinliyor{color:var(--warn);border-color:var(--warn);
                animation:nefes 1.1s ease-in-out infinite}
  .mik.sesli{color:var(--neon);border-color:rgba(0,255,65,.5)}
  #line{flex:1;background:none;border:0;outline:none;color:var(--ink);
        font:inherit;caret-color:var(--neon)}

  .foot{display:flex;justify-content:space-between;align-items:center;
        font-size:10px;letter-spacing:.16em;color:var(--gray);text-transform:uppercase}

  /* --- Venüs çekirdeği (Bölüm 13: varsayılan durumun bir parçası) ---
     Dekor değil gösterge: boşta sakin döner, komut işlenirken hızlanır,
     kritik bildirimde turuncuya döner, bağlantı düşünce durur. */
  .cekirdek{width:78px;height:78px;flex-shrink:0;position:relative}
  .cekirdek svg{width:100%;height:100%;overflow:visible}
  .cekirdek .chizgi{fill:none;stroke:var(--neon);vector-effect:non-scaling-stroke}
  .cekirdek .tik{stroke:var(--neon);opacity:.30;stroke-width:1}
  .cekirdek .yay{stroke-width:1.4;opacity:.85;stroke-dasharray:34 120;
                 stroke-linecap:round;transform-origin:60px 60px;
                 animation:don 9s linear infinite}
  .cekirdek .cember{stroke-width:1;opacity:.18}
  .cekirdek .yorunge{stroke-width:1;opacity:.42;transform-origin:60px 60px;
                     animation:don 22s linear infinite reverse}
  .cekirdek .kure{transform-origin:60px 60px;transform:rotate(-12deg)}
  .cekirdek .enlem{stroke-width:.9;opacity:.34}
  .cekirdek .cevre{stroke-width:1.1;opacity:.55}
  /* Boylamların yatay ölçeği daralıp genişleyince küre dönüyormuş gibi okunur. */
  .cekirdek .boylam{stroke-width:.9;opacity:.5;transform-origin:60px 60px;
                    animation:boylam 7s ease-in-out infinite}
  .cekirdek .boylam:nth-of-type(2){animation-delay:-2.33s}
  .cekirdek .boylam:nth-of-type(3){animation-delay:-4.66s}
  .cekirdek .oz{fill:var(--neon);stroke:none;
                filter:drop-shadow(0 0 6px var(--neon));animation:nefes 3.4s ease-in-out infinite}
  .cekirdek .hale{fill:var(--neon);stroke:none;
                  animation:hale 3.4s ease-in-out infinite}

  @keyframes don{to{transform:rotate(360deg)}}
  @keyframes boylam{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.04)}}
  @keyframes nefes{0%,100%{opacity:1}50%{opacity:.45}}
  @keyframes hale{0%,100%{opacity:.10}50%{opacity:.035}}

  /* meşgul: çekirdek hızlanır ve parlar — Venüs düşünüyor demektir */
  .cekirdek.mesgul .yay{animation-duration:1.5s;opacity:1;stroke-width:2}
  .cekirdek.mesgul .boylam{animation-duration:2.2s;opacity:.8}
  .cekirdek.mesgul .yorunge{animation-duration:6s;opacity:.7}
  .cekirdek.mesgul .oz{animation-duration:1s}
  .cekirdek.mesgul .hale{animation-duration:1s}
  /* uyarı: kritik bildirim rengi devralır */
  .cekirdek.uyari .chizgi{stroke:var(--warn)}
  .cekirdek.uyari .oz,.cekirdek.uyari .hale{fill:var(--warn)}
  .cekirdek.uyari .oz{filter:drop-shadow(0 0 10px var(--warn));animation-duration:.7s}
  .cekirdek.uyari .tik{stroke:var(--warn)}
  /* bağlantı yok: hareket durur, renk çekilir */
  .cekirdek.kapali{filter:grayscale(1);opacity:.34}
  .cekirdek.kapali *{animation-play-state:paused!important}

  /* açılış: çekirdek hızlı dönerek yerine oturur (Bölüm 13, sinematik açılış) */
  .cekirdek.uyaniyor{animation:cekirdekAcil 1.7s cubic-bezier(.16,.86,.24,1) both}
  .cekirdek.uyaniyor .yay{animation-duration:.85s}
  .cekirdek.uyaniyor .yorunge{animation-duration:2.4s}
  .cekirdek.uyaniyor .boylam{animation-duration:1.4s}
  @keyframes cekirdekAcil{
    from{opacity:0;transform:scale(.5) rotate(-120deg)}
    60%{opacity:1}
    to{opacity:1;transform:none}
  }

  /* --- HUD çerçevesi: köşe ayraçları --- */
  .shell{position:relative}
  .kose{position:absolute;width:14px;height:14px;border:1px solid var(--neon);
        opacity:.30;pointer-events:none}
  .kose.su{top:6px;left:6px;border-right:0;border-bottom:0}
  .kose.sag-u{top:6px;right:6px;border-left:0;border-bottom:0}
  .kose.sa{bottom:6px;left:6px;border-right:0;border-top:0}
  .kose.sag-a{bottom:6px;right:6px;border-left:0;border-top:0}

  /* --- cam paneller --- */
  .rail,.foot{background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,0));
              backdrop-filter:blur(6px);border:1px solid var(--rule);border-radius:3px;
              padding:12px 14px}
  .rail{border-bottom:1px solid var(--rule)}

  /* --- yanıt paneli: her komut bir kart, akan döküm değil --- */
  .panel{border:1px solid var(--rule);border-left:2px solid rgba(0,255,65,.45);
         border-radius:3px;margin:14px 0;
         background:linear-gradient(180deg,rgba(255,255,255,.028),rgba(255,255,255,.008));
         animation:panelGir .26s cubic-bezier(.2,.8,.25,1) both}
  .panel > .ust{display:flex;justify-content:space-between;align-items:baseline;
                gap:12px;padding:8px 14px;border-bottom:1px solid var(--rule)}
  /* Uzun jurnal komutu başlığı ele geçirmesin; tamamı title'da durur. */
  .panel .komut{font-size:10px;letter-spacing:.2em;color:var(--neon);
                white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .panel .damga{font-size:10px;letter-spacing:.14em;color:var(--gray)}
  .panel > .govde{padding:11px 14px 13px}
  .panel.uyarili{border-left-color:var(--warn)}
  .panel.uyarili .komut{color:var(--warn)}
  @keyframes panelGir{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  /* alan: hizayı ızgara verir, boşluk karakteri değil */
  .alan{display:grid;grid-template-columns:minmax(120px,204px) 1fr;gap:10px 18px;
        padding:2.5px 0;line-height:1.55}
  .alan .et{color:var(--gray);font-size:11.5px;letter-spacing:.05em;
            overflow-wrap:anywhere}
  /* Yetenek değer içinde bilerek boşlukla ayırabiliyor; HTML ezmesin. */
  .alan .dg{color:var(--ink);font-weight:500;overflow-wrap:anywhere;white-space:pre-wrap}
  .alan.dim .et,.alan.dim .dg{color:var(--gray);font-weight:400}
  .alan.warn .dg{color:var(--warn)}
  .alan.acik .dg{color:var(--neon)}
  .alan.acik .et{color:var(--ink)}
  .bolum{font-size:10px;letter-spacing:.22em;color:var(--neon);
         opacity:.85;margin:12px 0 6px}
  .bolum:first-child{margin-top:0}
  .ara{height:10px}

  /* --- yumuşak geçişler: satırlar belirir, çakmaz --- */
  .row{animation:gir .2s ease-out both}
  @keyframes gir{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}

  /* --- tarama süpürmesi: çok yavaş, çok sönük --- */
  .veil .tarama{position:absolute;left:0;right:0;height:220px;
    background:linear-gradient(180deg,transparent,rgba(0,255,65,.016),transparent);
    animation:supur 14s linear infinite}
  @keyframes supur{from{transform:translateY(-240px)}to{transform:translateY(100vh)}}

  @media (max-width:640px){
    .cekirdek{width:52px;height:52px}
    /* Dar ekranda iki sütun sıkışır; alan alta iner, hiza yine bozulmaz. */
    .alan{grid-template-columns:1fr;gap:0;padding:5px 0}
    .alan .dg{padding-left:0}
    .rail{grid-template-columns:1fr;gap:10px}
    .meta{justify-content:flex-start;text-align:left;gap:18px}
    .mark h1{font-size:28px}
    .row.wake{font-size:22px}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
    .veil::before,.veil .tarama{display:none}
    /* Hareket kapalıyken küre düz durmalı, yassı değil (Bölüm 13 erişilebilirlik). */
    .cekirdek .boylam{transform:none}
  }
</style>
</head>
<body>
<div class="veil"><div class="tarama"></div></div>

<div class="shell">
  <span class="kose su"></span><span class="kose sag-u"></span>
  <span class="kose sa"></span><span class="kose sag-a"></span>

  <header class="rail">
    <div class="mark">
      <h1>VENÜS</h1>
      <span class="state" id="state"><span class="pip"></span>çevrimdışı</span>
    </div>
    <div class="meta">
      <div class="cell"><div class="k">oturum</div><div class="v" id="up">00:00:00</div></div>
      <div class="cell"><div class="k">tarih</div><div class="v" id="date">—</div></div>
      <div class="cell"><div class="k">saat</div><div class="v stamp" id="clock">--:--</div></div>
    </div>
    <div class="cekirdek kapali" id="cekirdek" role="img" aria-label="Venüs çekirdeği">
      <svg viewBox="0 0 120 120">
        <g class="tik" id="tikler"></g>
        <circle class="chizgi cember" cx="60" cy="60" r="54"/>
        <circle class="chizgi yay"    cx="60" cy="60" r="54"/>
        <ellipse class="chizgi yorunge" cx="60" cy="60" rx="56" ry="19"/>
        <circle class="hale" cx="60" cy="60" r="34"/>
        <g class="kure">
          <circle  class="chizgi cevre"  cx="60" cy="60" r="34"/>
          <ellipse class="chizgi enlem"  cx="60" cy="60" rx="34" ry="11.5"/>
          <ellipse class="chizgi enlem"  cx="60" cy="60" rx="34" ry="24"/>
          <ellipse class="chizgi boylam" cx="60" cy="60" rx="34" ry="34"/>
          <ellipse class="chizgi boylam" cx="60" cy="60" rx="34" ry="34"/>
          <ellipse class="chizgi boylam" cx="60" cy="60" rx="34" ry="34"/>
        </g>
        <circle class="oz" cx="60" cy="60" r="3.6"/>
      </svg>
    </div>
  </header>

  <main class="flow" id="flow">
    <div class="ask" id="ask" hidden>
      <span class="sig">&gt;</span>
      <input id="line" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="komut">
      <button class="mik" id="hoparlor" type="button" title="sesli yanıt">♪</button>
      <button class="mik" id="mikrofon" type="button" hidden
              title="bas ve konuş (boşluk tuşu)">●</button>
    </div>
  </main>

  <footer class="foot">
    <span id="hint">"yardim" — yetenek listesi</span>
    <span><span id="rozet"></span><span id="count">0 yetenek</span></span>
  </footer>
</div>

<script>
const flow  = document.getElementById('flow');
const ask   = document.getElementById('ask');
const line  = document.getElementById('line');
const boot  = Date.now();

const pad = n => String(n).padStart(2,'0');

/* Türkçe büyük harf: i → İ. CSS text-transform bunu tarayıcıya bırakıyor ve
   lang="tr" olmasına rağmen her yerde doğru çalışmıyor. Başlıklar Venüs'ün
   yüzü; "ISTATISTIK" kabul edilemez. */
const buyuk = t => String(t).toLocaleUpperCase('tr-TR');

/* --- Venüs çekirdeği ---------------------------------------------------
   Gösterge olarak davranır: ne olduğunu söyler, süs olmaz. */
const cekirdek = document.getElementById('cekirdek');

(function tikleriCiz(){
  const g = document.getElementById('tikler');
  const NS = 'http://www.w3.org/2000/svg';
  for(let i = 0; i < 36; i++){
    const a = i * Math.PI / 18;
    const uzun = i % 3 === 0;                       // her 30°'de daha uzun çentik
    const [d1, d2] = uzun ? [58, 66] : [61, 65];
    const l = document.createElementNS(NS, 'line');
    l.setAttribute('x1', 60 + Math.cos(a)*d1); l.setAttribute('y1', 60 + Math.sin(a)*d1);
    l.setAttribute('x2', 60 + Math.cos(a)*d2); l.setAttribute('y2', 60 + Math.sin(a)*d2);
    if(uzun) l.setAttribute('opacity', .8);
    g.appendChild(l);
  }
})();

let uyariZaman = null;
function cekirdekDurum(ad, acik){
  cekirdek.classList.toggle(ad, acik);
}
function cekirdekUyar(){
  cekirdekDurum('uyari', true);
  clearTimeout(uyariZaman);
  uyariZaman = setTimeout(()=>cekirdekDurum('uyari', false), 5000);
}

function say(text, cls=''){
  return ekle(kur('row ' + cls, text, cls === 'wake'));
}
function kur(cls, text, ham=false){
  const el = document.createElement('div');
  el.className = cls;
  if(ham) el.innerHTML = text; else el.textContent = text;
  return el;
}
function ekle(el, hedef){
  if(hedef){ hedef.appendChild(el); panelSatir++; }
  else flow.insertBefore(el, ask);
  flow.scrollTop = flow.scrollHeight;
  return el;
}

/* Çekirdekten gelen satırı şekline göre çizer.
   Hizalama burada yapılır — yetenek boşlukla hizalamaz (Değişmez 6). */
function cizSatir(m, hedef){
  if(m.bosluk) return ekle(kur('ara', ''), hedef);
  if(m.baslik) return ekle(kur('bolum', buyuk(m.baslik)), hedef);
  if(m.etiket !== undefined){
    const el = kur('alan ' + (m.cls || ''), '');
    el.appendChild(kur('et', m.etiket));
    el.appendChild(kur('dg', m.deger));
    return ekle(el, hedef);
  }
  return ekle(kur('row ' + (m.cls || ''), m.text || ''), hedef);
}
function typeOut(text, cls='', ms=18){
  return new Promise(done=>{
    const el = say('', cls); let i = 0;
    const t = setInterval(()=>{
      el.textContent = text.slice(0, ++i);
      flow.scrollTop = flow.scrollHeight;
      if(i >= text.length){ clearInterval(t); done(); }
    }, ms);
  });
}
const pause = ms => new Promise(r=>setTimeout(r, ms));

/* --- üst ray --- */
setInterval(()=>{
  const d = new Date();
  document.getElementById('clock').textContent = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  document.getElementById('date').textContent =
    d.toLocaleDateString('tr-TR',{day:'2-digit',month:'short'}).toUpperCase();
  const s = Math.floor((Date.now()-boot)/1000);
  document.getElementById('up').textContent =
    `${pad(Math.floor(s/3600))}:${pad(Math.floor(s/60)%60)}:${pad(s%60)}`;
}, 1000);

function durum(on){
  document.getElementById('state').innerHTML =
    `<span class="pip${on?'':' off'}"></span>${on ? 'çevrimiçi' : 'bağlanıyor'}`;
  cekirdekDurum('kapali', !on);
}

/* --- çekirdek köprüsü --- */
let sock = null, hazir = false;
function baglan(){
  sock = new WebSocket(`ws://${location.host}/ws`);
  sock.onopen = ()=>{ durum(true); if(!hazir){ hazir = true; uyan(); } };
  sock.onmessage = e=>{
    const m = JSON.parse(e.data);
    if(typeof m.rozet === 'number') rozetle(m.rozet);
    if(m.bildirim){
      // Komut beklemeden gelir; bekleme göstergesine dokunmaz.
      if(m.durum === 'iletildi') bildirimGoster(m);
      return;
    }
    bekletme(false);
    if(m.bitti){ paneliKapat(); return; }
    cizSatir(m, panelGovde);
  };
  sock.onclose = ()=>{ durum(false); setTimeout(baglan, 2500); };
  sock.onerror = ()=>sock.close();
}

fetch('/yetenekler').then(r=>r.json())
  .then(y=>document.getElementById('count').textContent = `${y.length} yetenek`)
  .catch(()=>{});

function rozetle(n){
  document.getElementById('rozet').textContent = n ? `${n} bildirim · ` : '';
}

/* Açılış sekansı sürerken gelen bildirim animasyonun ortasına düşmemeli;
   sekans bitene kadar bekletilir. */
let acilisBitti = false;
const bekleyenBildirim = [];
function bildirimGoster(m){
  if(!acilisBitti){ bekleyenBildirim.push(m); return; }
  say(`${m.saat}  ${m.text}`, 'bildirim ' + m.seviye);
  if(m.seviye === 'kritik') cekirdekUyar();
  if(m.seviye === 'kritik' || m.seviye === 'yuksek') seslendir(m.text);
}

/* --- yanıt paneli ---------------------------------------------------
   Her komut kendi kartına yazılır. Akan tek bir metin sütunu terminaldir;
   panel, çıktının nereye ait olduğunu göz seviyesinde ayırır (Bölüm 13). */
let panel = null, panelGovde = null, panelSatir = 0;
function paneliAc(komut){
  paneliKapat();
  panel = kur('panel', '');
  const ust = kur('ust', '');
  const k = kur('komut', buyuk(komut));
  k.title = komut;
  ust.appendChild(k);
  const d = new Date();
  ust.appendChild(kur('damga', `${pad(d.getHours())}:${pad(d.getMinutes())}`));
  panelGovde = kur('govde', '');
  panel.appendChild(ust); panel.appendChild(panelGovde);
  panelSatir = 0;
  ekle(panel);
}
function paneliKapat(){
  if(panel && panelSatir === 0) panel.remove();   // çıktısı olmayan panel durmasın
  panel = null; panelGovde = null;
}

/* --- girdi --- */
const gecmis = []; let gi = -1;
function gonder(raw, ses=false){
  const t = raw.trim();
  if(!t) return;
  gecmis.push(t); gi = gecmis.length;
  if(t.toLowerCase() === 'temizle'){
    [...flow.querySelectorAll('.row,.panel')].forEach(n=>n.remove());
    return;
  }
  if(sock && sock.readyState === WebSocket.OPEN){
    paneliAc(ses ? '♪ ' + t : t);
    sock.send(JSON.stringify({cmd: t, ses}));
    bekletme(true);
  }
  else say('çekirdek kapalı — run.py çalışmıyor.', 'warn');
}

/* Serbest cümle niyet çözücüye gidince yanıt saniyeler sürebilir; kabuk
   donmuş görünmemeli. Kabuk ne beklediğini bilmez, sadece beklediğini bilir. */
let beklerSatir = null;
function bekletme(acik){
  cekirdekDurum('mesgul', acik);
  if(acik){
    // Gösterge panelin içine girer; panel açıkken dışarıda asılı kalmasın.
    if(!beklerSatir) beklerSatir = ekle(kur('row dim', '…'), panelGovde);
  } else if(beklerSatir){
    if(panelGovde && beklerSatir.parentNode === panelGovde) panelSatir--;
    beklerSatir.remove(); beklerSatir = null;
  }
}
line.addEventListener('keydown', e=>{
  if(e.key === 'Enter'){ gonder(line.value); line.value = ''; }
  else if(e.key === 'ArrowUp' && gi > 0){ line.value = gecmis[--gi]; e.preventDefault(); }
  else if(e.key === 'ArrowDown'){ gi = Math.min(gi+1, gecmis.length); line.value = gecmis[gi] || ''; }
});
flow.addEventListener('click', ()=>line.focus());

/* --- ses (Faz 4) ---------------------------------------------------
   Şartname Bölüm 8: ses bir GİRİŞ YÖNTEMİDİR, yetenek değildir. Sistemin
   ne yapabildiğini değiştirmez — aynı kapalı yetenek listesine gider.

   Uyandırma kelimesi BİLEREK yok. Bölüm 8: "Sürekli açık mikrofon + her
   cümleyi buluta yollama = pil ve fatura. Uyandırma kelimesi lokal
   çalışmalıdır." Tarayıcının konuşma tanıması sesi Google'a gönderir;
   sürekli açık bırakmak o maddeyi çiğnemek olurdu. Onun yerine bas-konuş:
   mikrofon yalnızca sen bastığın sürece açık.

   Sembol düzeltmesi burada yapılmaz — çekirdekte, deterministik olarak
   (core/sembol.py). Kabuk yalnızca "bu ses" bilgisini iletir. */
const mikrofon = document.getElementById('mikrofon');
const hoparlor = document.getElementById('hoparlor');
const Taniyici = window.SpeechRecognition || window.webkitSpeechRecognition;
let taniyici = null, dinliyor = false;

if(Taniyici){
  mikrofon.hidden = false;
  taniyici = new Taniyici();
  taniyici.lang = 'tr-TR';
  taniyici.interimResults = false;
  taniyici.maxAlternatives = 1;
  taniyici.onresult = e=>{
    const metin = e.results[0][0].transcript.trim();
    if(metin) gonder(metin, true);
  };
  taniyici.onerror = e=>{
    if(e.error !== 'aborted' && e.error !== 'no-speech')
      say(`mikrofon: ${e.error}`, 'warn');
  };
  taniyici.onend = ()=>{ dinliyor = false; mikrofon.classList.remove('dinliyor'); };
}

function dinlemeyiAc(){
  if(!taniyici || dinliyor) return;
  dinliyor = true;
  mikrofon.classList.add('dinliyor');
  try{ taniyici.start(); }
  catch(_){ dinliyor = false; mikrofon.classList.remove('dinliyor'); }
}
function dinlemeyiKapat(){ if(taniyici && dinliyor) taniyici.stop(); }

mikrofon.addEventListener('mousedown', dinlemeyiAc);
mikrofon.addEventListener('mouseup', dinlemeyiKapat);
mikrofon.addEventListener('mouseleave', dinlemeyiKapat);
mikrofon.addEventListener('touchstart', e=>{ e.preventDefault(); dinlemeyiAc(); });
mikrofon.addEventListener('touchend', e=>{ e.preventDefault(); dinlemeyiKapat(); });

/* Boşluk tuşu: girdi kutusu boşken bas-konuş. Yazarken araya girmez. */
addEventListener('keydown', e=>{
  if(e.code === 'Space' && !e.repeat && document.activeElement === line && !line.value){
    e.preventDefault(); dinlemeyiAc();
  }
});
addEventListener('keyup', e=>{ if(e.code === 'Space') dinlemeyiKapat(); });

/* Sesli yanıt: tarayıcıda yerel çalışır, buluta ses gitmez.
   Bölüm 12: KRİTİK ve YÜKSEK seslidir, NORMAL sessiz rozettir — komut
   çıktısı okunmaz, "komut okuyucu gibi" olmasın (Bölüm 8). */
let sesliYanit = localStorage.getItem('venus-ses') === '1';
function hoparlorTazele(){
  hoparlor.classList.toggle('sesli', sesliYanit);
  hoparlor.title = sesliYanit ? 'sesli yanıt açık' : 'sesli yanıt kapalı';
}
hoparlor.addEventListener('click', ()=>{
  sesliYanit = !sesliYanit;
  try{ localStorage.setItem('venus-ses', sesliYanit ? '1' : '0'); }catch(_){}
  hoparlorTazele();
  if(sesliYanit) seslendir('sesli yanıt açık');
});
hoparlorTazele();

function seslendir(metin){
  if(!sesliYanit || !window.speechSynthesis) return;
  const s = new SpeechSynthesisUtterance(metin);
  s.lang = 'tr-TR';
  s.rate = 1.02;           // komut okuyucu temposu değil, konuşma temposu
  s.pitch = .95;
  speechSynthesis.speak(s);
}

/* --- uyanış --- */
async function uyan(){
  cekirdekDurum('uyaniyor', true);
  await typeOut('çekirdek başlatılıyor', 'dim', 22);
  await pause(160);
  for(const p of ['yetenek kayıt defteri','olay günlüğü','köprü']){
    say(`  ${p}`, 'dim'); await pause(110);
  }
  await pause(260);
  cekirdekDurum('uyaniyor', false);
  say('VENÜS <b>hazır</b>', 'wake');
  acilisBitti = true;
  while(bekleyenBildirim.length) bildirimGoster(bekleyenBildirim.shift());
  ask.hidden = false;
  line.focus();
}
baglan();
